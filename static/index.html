<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riffbox</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<main id="login" hidden>
  <h1>Riffbox</h1>
  <form id="login-form">
    <label for="pass">Passphrase</label>
    <input id="pass" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Log in</button>
    <p id="login-error" class="error" role="alert" hidden></p>
  </form>
</main>

<div id="app" hidden>
  <header>
    <h1>Riffbox</h1>
    <nav>
      <a id="how-link" class="quiet" href="#how">How this works</a>
      <button id="logout" class="link">Log out</button>
    </nav>
  </header>

  <section id="how-view" aria-labelledby="how-h" hidden>
    <p><a id="how-back" href="#">← Back to recordings</a></p>
    <h2 id="how-h" class="how-title">How this works</h2>
    <div id="how-body">Loading…</div>
  </section>

  <div id="main-view">
  <section aria-labelledby="up-h">
    <h2 id="up-h">Upload</h2>
    <div id="drop" tabindex="0">
      <p>Drop audio files here, or <label for="file" class="pick">choose files</label></p>
      <input id="file" type="file" multiple accept="audio/*,.m4a,.caf,.aac,.wav,.mp3,.aif,.aiff,.flac,.ogg">
    </div>
    <ul id="queue"></ul>
  </section>

  <section aria-labelledby="lib-h">
    <h2 id="lib-h">Recordings <span id="count"></span></h2>
    <div id="views" role="group" aria-label="Which recordings to show">
      <button id="tab-inbox" type="button" aria-pressed="true">Inbox</button>
      <button id="tab-library" type="button" aria-pressed="false">Library</button>
    </div>
    <p id="notice" role="status" aria-live="polite" hidden></p>
    <p id="empty" hidden></p>
    <ul id="list"></ul>
    <p id="audio-error" class="error" role="alert" hidden></p>
  </section>
  </div>
</div>

<div id="playerbar" hidden>
  <audio id="player" controls preload="none"></audio>
</div>
<script src="static/app.js"></script>
</body>
</html>
