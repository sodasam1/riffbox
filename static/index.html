<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riffbox</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<main id="login" hidden>
  <h1>Riffbox</h1>
  <form id="login-form">
    <label for="pass">Passphrase</label>
    <input id="pass" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Log in</button>
    <p id="login-error" class="error" role="alert" hidden></p>
  </form>
</main>

<div id="app" hidden>
  <header>
    <h1>Riffbox</h1>
    <nav>
      <a id="how-link" class="quiet" href="#how">How this works</a>
      <button id="logout" class="link">Log out</button>
    </nav>
  </header>

  <section id="how-view" aria-labelledby="how-h" hidden>
    <p><a id="how-back" href="#">← Back to recordings</a></p>
    <h2 id="how-h" class="how-title">How this works</h2>
    <div id="how-body">Loading…</div>
  </section>

  <div id="main-view">
  <section aria-labelledby="up-h">
    <h2 id="up-h">Upload</h2>
    <div id="drop" tabindex="0">
      <p>Drop audio files here, or <label for="file" class="pick">choose files</label></p>
      <input id="file" type="file" multiple accept="audio/*,.m4a,.caf,.aac,.wav,.mp3,.aif,.aiff,.flac,.ogg">
    </div>
    <ul id="queue"></ul>
  </section>

  <section aria-labelledby="lib-h">
    <h2 id="lib-h">Recordings <span id="count"></span></h2>
    <div id="views" role="group" aria-label="Which recordings to show">
      <button id="tab-inbox" type="button" aria-pressed="true">Inbox</button>
      <button id="tab-library" type="button" aria-pressed="false">Library</button>
    </div>
    <p id="notice" role="status" aria-live="polite" hidden></p>
    <div id="browser">
      <aside id="filters" aria-label="Filter and sort the Library" hidden>
        <button id="filters-toggle" type="button" aria-expanded="false" aria-controls="filters-panel">Filters</button>
        <div id="filters-panel">
          <div class="field">
            <label for="f-q">Search</label>
            <input id="f-q" type="search" placeholder="Title, notes or tag" autocomplete="off" maxlength="200">
          </div>
          <fieldset>
            <legend>Tags</legend>
            <div id="f-tags" class="tagbox" role="group" aria-label="Filter by tag"></div>
            <div class="matchrow">
              <span class="radio"><input type="radio" name="f-match" id="f-match-all" value="all" checked><label for="f-match-all">Has all selected</label></span>
              <span class="radio"><input type="radio" name="f-match" id="f-match-any" value="any"><label for="f-match-any">Has any selected</label></span>
            </div>
          </fieldset>
          <fieldset>
            <legend>Tempo</legend>
            <span class="radio"><input type="checkbox" id="f-tempo-slow" value="slow"><label for="f-tempo-slow">Slow</label></span>
            <span class="radio"><input type="checkbox" id="f-tempo-medium" value="medium"><label for="f-tempo-medium">Medium</label></span>
            <span class="radio"><input type="checkbox" id="f-tempo-fast" value="fast"><label for="f-tempo-fast">Fast</label></span>
          </fieldset>
          <div class="keyrow">
            <div class="field"><label for="f-root">Key</label><select id="f-root"><option value="">Any</option></select></div>
            <div class="field"><label for="f-mode">Major / minor</label>
              <select id="f-mode"><option value="">Any</option><option value="major">major</option><option value="minor">minor</option></select></div>
          </div>
          <div class="field">
            <label for="f-sort">Sort by</label>
            <div class="sortrow">
              <select id="f-sort">
                <option value="recorded">Recorded</option>
                <option value="uploaded">Uploaded</option>
                <option value="title">Title</option>
                <option value="bpm">BPM</option>
              </select>
              <button id="f-order" type="button">↓</button>
            </div>
          </div>
          <span class="radio"><input type="checkbox" id="f-preview" checked><label for="f-preview">Play as I move through the list</label></span>
          <p id="f-count" class="meta" role="status" aria-live="polite"></p>
          <button id="f-clear" type="button">Clear filters</button>
        </div>
      </aside>
      <div id="results">
        <div id="colhead" aria-hidden="true"><span></span><span>Title</span><span>Tags</span><span>Tempo · key</span><span>Recorded</span><span></span></div>
        <p id="empty" hidden></p>
        <ul id="list" tabindex="0" aria-label="Recordings"></ul>
        <p id="kbd-hint" class="meta" hidden>Click a recording or Tab to the list, then ↑ ↓ to move and Space to play or pause.</p>
        <p id="audio-error" class="error" role="alert" hidden></p>
      </div>
    </div>
  </section>
  </div>
</div>

<div id="playerbar" hidden>
  <audio id="player" controls preload="none"></audio>
</div>
<script src="static/app.js"></script>
</body>
</html>
